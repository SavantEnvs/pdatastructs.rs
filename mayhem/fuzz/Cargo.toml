[package]
name = "pdatastructs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: without this, cargo walks UP looking for a workspace and either
# joins the upstream package's implicit workspace or errors "current package believes it's in a
# workspace when it's not" against the upstream root Cargo.toml (which we must never edit).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.pdatastructs]
path = "../.."

[[bin]]
name = "fuzz_bloomfilter"
path = "fuzz_targets/fuzz_bloomfilter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_countminsketch"
path = "fuzz_targets/fuzz_countminsketch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hyperloglog"
path = "fuzz_targets/fuzz_hyperloglog.rs"
test = false
doc = false
bench = false
