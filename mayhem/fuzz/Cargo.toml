[package]
name = "pdatastructs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: without this, cargo walks UP looking for a workspace and either
# joins the upstream package's implicit workspace or errors "current package believes it's in a
# workspace when it's not" against the upstream root Cargo.toml (which we must never edit).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

# default-features off: this target only needs countminsketch/topk (feature "num-traits"). The
# default "rand" feature pulls in a rand_core -> zerocopy 0.8.x chain that hits zerocopy's
# `stdarch_x86_avx512` unstable-feature gate (E0658) on the pinned ASan nightly (see
# mayhem/Dockerfile's RUST_STABLE_TOOLCHAIN note on the same trap for `cargo test`'s dev-deps) —
# avoided here by simply not needing "rand" at all.
[dependencies.pdatastructs]
path = "../.."
default-features = false
features = ["num-traits"]

[[bin]]
name = "cms_heap"
path = "fuzz_targets/cms_heap.rs"
test = false
doc = false
bench = false
